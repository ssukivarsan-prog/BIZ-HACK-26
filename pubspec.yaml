name: veggie_vendor_app
description: A production-ready Vegetable Vendor & Customer Ordering App.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Firebase
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.4
  cloud_firestore: ^5.2.1
  firebase_storage: ^12.1.3
  firebase_messaging: ^15.0.4
  flutter_local_notifications: ^17.2.2

  # UI & Animations
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10+1
  lottie: ^3.1.2
  badges: ^3.1.2
  fl_chart: ^0.68.0

  # Navigation
  go_router: ^14.2.7

  # Utilities
  image_picker: ^1.1.2
  intl: ^0.19.0
  uuid: ^4.4.0
  shared_preferences: ^2.5.5
  connectivity_plus: ^6.0.3
  logger: ^2.4.0
  equatable: ^2.0.5

  # Icons
  cupertino_icons: ^1.0.8
  iconsax: ^0.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  riverpod_generator: ^2.4.3
  build_runner: ^2.4.11
  flutter_launcher_icons: ^0.14.4

  image: any
flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/categories/
    - assets/icons/
    - assets/animations/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/images/logo.png"

